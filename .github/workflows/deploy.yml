name: Check site

# GitHub Pages publishes main:/docs directly ("Deploy from a branch"), so the site goes live
# without Actions. This workflow only proves docs/ is correct and current, and pings IndexNow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, build and validate
        run: |
          node --test tools-src/tests/*.test.mjs
          node tools-src/build.mjs
          node tools-src/validate.mjs
      - name: docs/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::docs/ is out of date. Run 'node tools-src/build.mjs' and commit docs/."
            exit 1
          fi
      # Tell Bing/Yandex (and Bing-powered AI search) the site changed. Never fails the run.
      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          node -e "
            const s = require('./tools-src/site.json');
            const urls = [...require('fs').readFileSync('docs/sitemap.xml', 'utf8').matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
            const body = { host: new URL(s.origin).hostname, key: s.indexNowKey,
              keyLocation: s.origin + '/' + s.indexNowKey + '.txt', urlList: urls.concat(s.origin + '/llms.txt') };
            fetch('https://api.indexnow.org/indexnow', { method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify(body) })
              .then(r => console.log('IndexNow HTTP', r.status));
          "
