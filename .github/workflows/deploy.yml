name: Check site

# GitHub Pages publishes main:/docs directly ("Deploy from a branch"), so the site goes live
# without Actions. This workflow only proves docs/ is correct and current. IndexNow is pinged after each Pages
# deploy by cloudflare-purge.yml, with only the pages that changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, build and validate
        run: |
          node --test tools-src/tests/*.test.mjs
          node tools-src/build.mjs
          node tools-src/validate.mjs
      - name: docs/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- docs documentation/blogger-redirects.xml)" ]; then
            git status --short -- docs documentation/blogger-redirects.xml
            echo "::error::docs/ is out of date. Run 'node tools-src/build.mjs' and commit docs/ and documentation/blogger-redirects.xml."
            exit 1
          fi
